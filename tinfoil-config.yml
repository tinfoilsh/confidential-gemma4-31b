cvm-version: 0.7.5
cpus: 16
memory: 65536
gpus: 1

models:
  - name: "gemma-4-31b"
    repo: "google/gemma-4-31B-it@fb9ae262347c3945692f09a612f8bb189def854f"
    mpk: "d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4_62578688000_421c697b-8a62-59e2-9085-819a35012c0b"

containers:
  - name: "gemma4-31b"
    image: "ghcr.io/tinfoilsh/confidential-gemma4-31b@sha256:a8b3e1e64a2e5899b2a8a71c426ecd5c4ea6085c52dc9b154e0747b687e4115c" # v0.0.14
    runtime: nvidia
    gpus: all
    ipc: host
    command: [
      "--model", "/tinfoil/mpk/mpk-d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4",
      "--tensor-parallel-size", "1",
      "--gpu-memory-utilization", "0.95",
      "--served-model-name", "gemma4-31b",
      "--enable-auto-tool-choice",
      "--tool-call-parser", "gemma4",
      "--reasoning-parser", "gemma4",
      "--chat-template", "examples/tool_chat_template_gemma4.jinja",
      "--scheduling-policy", "priority",
      "--max-num-seqs", "32",
      "--port", "8001"
    ]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /metrics
    - /health
