cvm-version: 0.10.4
cpus: 16
memory: 65536
gpus: 1

models:
  - name: "gemma-4-31b"
    repo: "google/gemma-4-31B-it@fb9ae262347c3945692f09a612f8bb189def854f"
    mpk: "d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4_62578688000_421c697b-8a62-59e2-9085-819a35012c0b"
  - name: "gemma-4-31b-assistant"
    repo: "google/gemma-4-31B-it-assistant@34ef9f029d1c52bccac2def222523af32f3ccd0f"
    mpk: "2d92158d05e976de143bd05ff87977c73523ce6adeff1b559ebf32a2d230d634_971251712_27ee073f-136c-5855-a1a3-1fdc293ec0bb"

containers:
  - name: "gemma4-31b"
    image: "ghcr.io/tinfoilsh/confidential-gemma4-31b@sha256:16da3b200a256cca3dea0071b5221cc6972952674f77d9a6187472ea752fba62" # v0.0.19
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - VLLM_CC_PAGEABLE_H2D: "1"
      - VLLM_CC_OUTPUT_WORKER: "1"
      - VLLM_CC_SPEC_COUNT_FAST_PUBLICATION: "1"
      - VLLM_CC_DECODE_METADATA_FASTPATH: "1"
      # Patch 0114 passed sequential, concurrent, and no-MTP CC validation.
      - VLLM_CC_BLOCK_TABLE_DIRTY_UPDATE: "1"
    command: ["--model", "/tinfoil/mpk/mpk-d2f38032f5faaa8a45b433157d0f25da1e533cf233784c7438fe9f46d1fbc3f4","--tensor-parallel-size",
      "1", "--gpu-memory-utilization", "0.90", "--served-model-name", "gemma4-31b", "--enable-auto-tool-choice", "--tool-call-parser",
      "gemma4", "--reasoning-parser", "gemma4", "--chat-template", "examples/tool_chat_template_gemma4.jinja", "--scheduling-policy",
      "priority", "--max-num-seqs", "8", "--speculative-config",
      "{\"method\":\"mtp\",\"model\":\"/tinfoil/mpk/mpk-2d92158d05e976de143bd05ff87977c73523ce6adeff1b559ebf32a2d230d634\",\"num_speculative_tokens\":4}",
      "--port", "8001"]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /metrics
    - /health
